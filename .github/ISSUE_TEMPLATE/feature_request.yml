name: Feature Request
description: Suggest a feature for marko-zag
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: input
    id: parity
    attributes:
      label: Official-adapter parity
      description: >
        If an official Zag adapter (react/vue/solid/svelte/preact/vanilla)
        already has this, link its source — parity requests are the easiest
        to accept.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
